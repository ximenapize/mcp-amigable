[project]
name = "amigable-mef"
version = "0.1.0"
description = "Servidor MCP con el presupuesto y la ejecución del gasto público del Perú, desde la Consulta Amigable del MEF"
requires-python = ">=3.11"
dependencies = ["fastmcp>=4,<5", "httpx", "pandas"]

[dependency-groups]
dev = [
    "matplotlib>=3.11.2",
    "pdfplumber>=0.11.10",
    "pytest",
]
